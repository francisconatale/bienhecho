installed:
- agent-context
- auto-commit
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after specification
    condition: null
  - extension: auto-commit
    command: speckit.auto-commit
    enabled: true
    optional: false
    priority: 5
    description: Auto-commit changes after specification
    condition: null
  after_plan:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after planning
    condition: null
  - extension: auto-commit
    command: speckit.auto-commit
    enabled: true
    optional: false
    priority: 5
    description: Auto-commit changes after planning
    condition: null
  after_tasks:
  - extension: auto-commit
    command: speckit.auto-commit
    enabled: true
    optional: false
    priority: 5
    description: Auto-commit changes after task generation
    condition: null
  after_implement:
  - extension: auto-commit
    command: speckit.auto-commit
    enabled: true
    optional: false
    priority: 5
    description: Auto-commit changes after implementation
    condition: null
